name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false

      # Không bật cache: 'pnpm' — setup-node gọi `pnpm store path`, lệnh này
      # fail vì pnpm-workspace.yaml của repo không khai field `packages`.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # .env bi gitignore; build chi can cac bien NEXT_PUBLIC_* ton tai, khong can gia tri that.
      - run: cp .env.example .env

      # Build truoc typecheck: next-env.d.ts bi gitignore va no reference
      # .next/types/routes.d.ts — ca hai chi ton tai sau khi `next build` chay,
      # nen chay typecheck trong CI truoc build se bao thieu module cho moi
      # import anh va route.
      - run: pnpm build

      - run: pnpm typecheck
