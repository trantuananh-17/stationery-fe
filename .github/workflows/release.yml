# Gắn tag vX.Y.Z là phát hành: build ảnh Next standalone, đẩy lên GHCR, rồi
# triển khai lên môi trường tương ứng.
#
# Tag có hậu tố rc (v1.2.0rc1) đi staging; tag sạch (v1.2.0) đi production.
#
# Mọi biến NEXT_PUBLIC_* được nhúng vào bundle client lúc build, nên chúng là
# build arg lấy từ GitHub Environment chứ không phải biến runtime. Đổi domain
# API nghĩa là phải phát hành một version mới.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
      environment: ${{ steps.meta.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image and environment
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME}"
          IMAGE="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          case "$VERSION" in
            *rc*) ENVIRONMENT=staging ;;
            *)    ENVIRONMENT=production ;;
          esac
          {
            echo "version=$VERSION"
            echo "image=$IMAGE"
            echo "environment=$ENVIRONMENT"
          } >> "$GITHUB_OUTPUT"

  push:
    name: Push to GHCR
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ needs.build.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          push: true
          tags: |
            ${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}
            ${{ needs.build.outputs.image }}:latest
          build-args: |
            NEXT_PUBLIC_SERVER_API=${{ vars.NEXT_PUBLIC_SERVER_API }}
            NEXT_PUBLIC_SERVER_AI_API=${{ vars.NEXT_PUBLIC_SERVER_AI_API }}
            NEXT_PUBLIC_SERVER_UPLOAD_API=${{ vars.NEXT_PUBLIC_SERVER_UPLOAD_API }}
            NEXT_PUBLIC_SOCKET_URL=${{ vars.NEXT_PUBLIC_SOCKET_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_ACCESS_TOKEN_EXPIRES=${{ vars.NEXT_PUBLIC_ACCESS_TOKEN_EXPIRES }}
            NEXT_PUBLIC_REFRESH_TOKEN_EXPIRES=${{ vars.NEXT_PUBLIC_REFRESH_TOKEN_EXPIRES }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build, push]
    uses: ./.github/workflows/deploy-template.yml
    with:
      environment: ${{ needs.build.outputs.environment }}
      version: ${{ needs.build.outputs.version }}
      image: ${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}
      tag_var: IMAGE_TAG_FRONTEND
      services: fe
    secrets: inherit
